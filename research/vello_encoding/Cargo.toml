[package]
name = "netrender-vello-encoding"
version.workspace = true # We mimic Vello's version
description = "Netrender's Vello 0.11 encoding types for wgpu 30: the data that needs to be rendered, with device-pixel curve quality bounds. Library name `vello_encoding`."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vello_encoding"

[package.metadata.docs.rs]
all-features = true
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []

[features]
# Enables an optional GPU memory usage estimation utility. This can be used to
# perform additional computations in order to estimate the minimum required allocations
# for buffers backing bump-allocated GPU memory.
bump_estimate = []

[lints]
workspace = true

[dependencies]
bytemuck = { workspace = true }
skrifa = { workspace = true, features = ["std"] }
peniko = { workspace = true, default-features = true }
guillotiere = { workspace = true, features = ["std"] }
smallvec = { workspace = true }
